version: "3.9"
services:
  db:
    image: postgres:15
    container_name: algocore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: algocoredb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: parola
    ports:
      - "5432:5432"
    volumes:
      - algocore-data:/var/lib/postgresql/data

volumes:
  algocore-data:

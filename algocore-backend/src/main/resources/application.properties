spring.application.name=algocore-backend
spring.profiles.active = local
# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Pagination configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Logging configuration
logging.level.org.algocore.algocorebackend=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000
jwt.refresh-expiration-ms=1209600000
admin.default-password=${ADMIN_DEFAULT_PASSWORD:}

# Spring Security might need this
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Judge 0
judge0.url=https://judge0-ce.p.rapidapi.com/
judge0.rapidapi.host=judge0-ce.p.rapidapi.com
judge0.rapidapi.key=${JUDGE0_RAPIDAPI_KEY:}
